name: CI - Dev Branch

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

env:
  IMAGE_NAME: tamagotchme

jobs:
  security-scan:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for better secret detection

    - name: Secret Scanning with Gitleaks
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety

    - name: Run Bandit (SAST)
      run: |
        bandit -r src/ -f json -o bandit-report.json || true
        bandit -r src/ -f txt
      continue-on-error: true

    - name: Run Safety (Dependency Check)
      run: |
        pip install -r requirements.txt
        safety check --json --output safety-report.json || true
        safety check || true
      continue-on-error: true

    - name: Upload security reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-reports
        path: |
          bandit-report.json
          safety-report.json

  build-and-test:
    runs-on: ubuntu-latest
    needs: security-scan
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: Run tests
      run: |
        pytest tests/ -v --cov=src --cov-report=term-missing || echo "No tests found yet"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        load: true
        tags: ${{ env.IMAGE_NAME }}:dev-${{ github.sha }}

    - name: Run Trivy vulnerability scanner (Container Image Scan)
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.IMAGE_NAME }}:dev-${{ github.sha }}
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Run Trivy vulnerability scanner (Display)
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.IMAGE_NAME }}:dev-${{ github.sha }}
        format: 'table'
        severity: 'CRITICAL,HIGH'

    - name: Upload Trivy scan results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: trivy-results
        path: trivy-results.sarif

    - name: Test Docker image
      run: |
        docker run -d --name test-container -p 8080:8080 \
          -e HOST=0.0.0.0 -e PORT=8080 -e DEBUG=False \
          ${{ env.IMAGE_NAME }}:dev-${{ github.sha }}
        
        # Wait for container to be ready
        sleep 10
        
        # Check if container is running
        docker ps | grep test-container
        
        # Check container logs
        docker logs test-container
        
        # Clean up
        docker stop test-container
        docker rm test-container

    - name: Build summary
      run: |
        echo "### ✅ Build Successful" >> $GITHUB_STEP_SUMMARY
        echo "- **Branch:** dev" >> $GITHUB_STEP_SUMMARY
        echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Image:** ${{ env.IMAGE_NAME }}:dev-${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🔒 Security Scans Completed" >> $GITHUB_STEP_SUMMARY
        echo "- Secret scanning (Gitleaks)" >> $GITHUB_STEP_SUMMARY
        echo "- Static analysis (Bandit)" >> $GITHUB_STEP_SUMMARY
        echo "- Dependency check (Safety)" >> $GITHUB_STEP_SUMMARY
        echo "- Container scan (Trivy)" >> $GITHUB_STEP_SUMMARY
