name: CI/CD - Prod Branch

on:
  push:
    branches: [ prod]
  workflow_dispatch:
    inputs:
      rollback_revision:
        description: 'Revision name to rollback to (leave empty for new deployment)'
        required: false
        type: string

concurrency:
  group: prod-deployment
  cancel-in-progress: false

env:
  IMAGE_NAME: tamagotchme
  AZURE_CONTAINER_APP_NAME: tamagotchme-app
  AZURE_CONTAINER_ENV_NAME: tamagotchme-env

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.rollback_revision == '')
    
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}
      short_sha: ${{ steps.short.outputs.sha }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: Run tests
      run: |
        pytest tests/ -v --cov=src --cov-report=term-missing || echo "No tests found yet"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Azure Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ secrets.ACR_LOGIN_SERVER }}
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}
        tags: |
          type=sha,prefix=prod-,format=short
          type=raw,value=latest

    - name: Build and push Docker image
      id: build
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Generate short SHA
      id: short
      run: |
        echo "sha=${GITHUB_SHA:0:7}" >> $GITHUB_OUTPUT

    - name: Build summary
      run: |
        echo "### ✅ Build and Push Successful" >> $GITHUB_STEP_SUMMARY
        echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Image:** ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:prod-${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Digest:** ${{ steps.build.outputs.digest }}" >> $GITHUB_STEP_SUMMARY

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.rollback_revision == '')
    
    steps:
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Extract ACR name from login server
      id: acr
      run: |
        ACR_NAME=$(echo "${{ secrets.ACR_LOGIN_SERVER }}" | cut -d'.' -f1)
        echo "name=$ACR_NAME" >> $GITHUB_OUTPUT

    - name: Verify image exists in ACR
      run: |
        IMAGE_TAG="prod-${{ needs.build-and-test.outputs.short_sha }}"
        echo "Checking for image: ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:$IMAGE_TAG"
        
        # List tags to see what's actually in the registry
        echo "Available tags in ACR:"
        az acr repository show-tags \
          --name ${{ steps.acr.outputs.name }} \
          --repository ${{ env.IMAGE_NAME }} \
          --output table || echo "Repository not found or empty"
        
        # Check if our specific tag exists
        if az acr repository show-tags \
          --name ${{ steps.acr.outputs.name }} \
          --repository ${{ env.IMAGE_NAME }} \
          --output tsv | grep -q "^$IMAGE_TAG$"; then
          echo "✅ Image tag found: $IMAGE_TAG"
        else
          echo "❌ Image tag NOT found: $IMAGE_TAG"
          echo "The build job may have failed or the image wasn't pushed"
          exit 1
        fi

    - name: Clean up failed Container App if exists
      run: |
        if az containerapp show --name ${{ secrets.AZURE_CONTAINER_APP_NAME }} --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} --query "properties.provisioningState" -o tsv 2>/dev/null | grep -q "Failed"; then
          echo "Container App in failed state, deleting..."
          az containerapp delete \
            --name ${{ secrets.AZURE_CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --yes
          echo "Waiting for deletion to complete..."
          sleep 30
        fi

    - name: Deploy to Azure Container Apps
      id: deploy
      uses: azure/container-apps-deploy-action@v1
      with:
        resourceGroup: ${{ secrets.AZURE_RESOURCE_GROUP }}
        containerAppName: ${{ secrets.AZURE_CONTAINER_APP_NAME }}
        acrName: ${{ steps.acr.outputs.name }}
        acrUsername: ${{ secrets.ACR_USERNAME }}
        acrPassword: ${{ secrets.ACR_PASSWORD }}
        imageToDeploy: ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:prod-${{ needs.build-and-test.outputs.short_sha }}
        location: westeurope
        targetPort: 8080
        ingress: external
        environmentVariables: |
          HOST=0.0.0.0
          PORT=8080
          DEBUG=False
          DATABASE_URL=sqlite:///life_planner.db
          DATABASE_PATH=/app/data/life_planner.db
          APP_NAME=Life Planner
          VERSION=1.0.0
          LOG_LEVEL=INFO
          SECRET_KEY=${{ secrets.FLASK_SECRET_KEY }}

    - name: Get revision name
      id: revision
      run: |
        REVISION=$(az containerapp revision list \
          --name ${{ secrets.AZURE_CONTAINER_APP_NAME }} \
          --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
          --query "[0].name" -o tsv)
        echo "revision_name=$REVISION" >> $GITHUB_OUTPUT

    - name: Deployment summary
      run: |
        echo "### 🚀 Deployment Successful" >> $GITHUB_STEP_SUMMARY
        echo "- **Container App:** ${{ secrets.AZURE_CONTAINER_APP_NAME }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Resource Group:** ${{ secrets.AZURE_RESOURCE_GROUP }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Revision:** ${{ steps.revision.outputs.revision_name }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Image:** ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:prod-${{ needs.build-and-test.outputs.short_sha }}" >> $GITHUB_STEP_SUMMARY

  rollback:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.rollback_revision != ''
    
    steps:
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Rollback to previous revision
      run: |
        az containerapp revision activate \
          --name ${{ secrets.AZURE_CONTAINER_APP_NAME }} \
          --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
          --revision ${{ github.event.inputs.rollback_revision }}

    - name: Rollback summary
      run: |
        echo "### ⏪ Rollback Successful" >> $GITHUB_STEP_SUMMARY
        echo "- **Container App:** ${{ secrets.AZURE_CONTAINER_APP_NAME }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Rolled back to:** ${{ github.event.inputs.rollback_revision }}" >> $GITHUB_STEP_SUMMARY

  health-check:
    needs: deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.rollback_revision == '')
    
    steps:
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Get Container App URL
      id: get-url
      run: |
        FQDN=$(az containerapp show \
          --name ${{ secrets.AZURE_CONTAINER_APP_NAME }} \
          --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
          --query properties.configuration.ingress.fqdn -o tsv)
        echo "app_url=https://$FQDN" >> $GITHUB_OUTPUT

    - name: Wait for deployment to stabilize
      run: sleep 30

    - name: Health check
      run: |
        RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" ${{ steps.get-url.outputs.app_url }}/health || echo "000")
        if [ "$RESPONSE" = "200" ]; then
          echo "✅ Health check passed"
          echo "### ✅ Health Check Passed" >> $GITHUB_STEP_SUMMARY
          echo "- **URL:** ${{ steps.get-url.outputs.app_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** Healthy (200)" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Health check failed with status: $RESPONSE"
          echo "### ❌ Health Check Failed" >> $GITHUB_STEP_SUMMARY
          echo "- **URL:** ${{ steps.get-url.outputs.app_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** $RESPONSE" >> $GITHUB_STEP_SUMMARY
          exit 1
        fi
