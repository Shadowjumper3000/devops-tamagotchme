{% extends "base.html" %}

{% block title %}Register - Tamagotchi Tracker{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-box">
        <h1>🎉 Create Account</h1>
        <p class="subtitle">Start your Tamagotchi journey</p>
        
        <form method="POST" action="{{ url_for('auth.register') }}" class="auth-form">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required autofocus>
            </div>
            
            <div class="form-group">
                <label for="username">Username (Display Name)</label>
                <input type="text" id="username" name="username" required>
            </div>
            
            <div class="form-group">
                <label for="pet_name">Pet Name</label>
                <input type="text" id="pet_name" name="pet_name" required placeholder="Name your Tamagotchi">
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required minlength="6">
            </div>
            
            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" required minlength="6">
            </div>
            
            <button type="submit" class="btn btn-primary">Create Account</button>
        </form>
        
        <p class="auth-footer">
            Already have an account? <a href="{{ url_for('auth.login') }}">Login here</a>
        </p>
    </div>
</div>
{% endblock %}
