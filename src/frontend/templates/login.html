{% extends "base.html" %}

{% block title %}Login - Tamagotchi Tracker{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-box">
        <h1>🐾 Welcome Back!</h1>
        <p class="subtitle">Login to check on your Tamagotchi</p>
        
        <form method="POST" action="{{ url_for('auth.login') }}" class="auth-form">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required autofocus>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            
            <button type="submit" class="btn btn-primary">Login</button>
        </form>
        
        <p class="auth-footer">
            Don't have an account? <a href="{{ url_for('auth.register') }}">Register here</a>
        </p>
    </div>
</div>
{% endblock %}
